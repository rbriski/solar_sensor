<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" role="img" aria-labelledby="title desc">
<title id="title">R5 perfboard corner mounting pattern</title><desc id="desc">70 by 30 mm board. Four approximately 2 mm holes have centres 2 mm in from each edge, yielding a 66 by 26 mm rectangle.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#45626d"/></marker></defs>
<style>text{font-family:system-ui,sans-serif;fill:#203e4b}.dim{stroke:#45626d;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.ext{stroke:#9bb1ba;stroke-width:1}.sm{font-size:17px}</style>
<rect width="900" height="490" rx="12" fill="#f3f7f8"/><text x="35" y="42" font-size="25" font-weight="700">Perfboard · 66 × 26 mm hole centers</text>
<rect x="135" y="125" width="630" height="270" rx="3" fill="#f3e4bf" stroke="#94712d" stroke-width="2"/>
<g fill="#fff" stroke="#207d70" stroke-width="2"><circle cx="153" cy="143" r="9"/><circle cx="747" cy="143" r="9"/><circle cx="747" cy="377" r="9"/><circle cx="153" cy="377" r="9"/></g>
<path class="ext" d="M153 143V75M747 143V75M747 143H817M747 377H817"/>
<path class="dim" d="M153 88H747M804 143V377"/><text x="450" y="80" text-anchor="middle" font-size="22">66</text><text x="819" y="268" font-size="22">26</text>
<text x="450" y="225" text-anchor="middle" font-size="24">70 × 30 board</text><text x="450" y="259" text-anchor="middle" class="sm">4 × approximately Ø2 mounting holes</text><text x="450" y="289" text-anchor="middle" class="sm">Ø1.3 pilots · self-tapping screw fit to verify</text>
<text x="175" y="330" class="sm">← USB</text><text x="720" y="330" text-anchor="end" class="sm">W7–W9 →</text>
<text x="135" y="433" class="sm">Hole centers: 2 mm from each adjacent board edge.</text><text x="135" y="461" class="sm">Pattern copied from the water-softener P1/D1 measurement record.</text></svg>
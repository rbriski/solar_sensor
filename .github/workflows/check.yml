name: Check project
on: [push, pull_request]
permissions:
  contents: read
jobs:
  receiver-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r monitor/requirements.txt
      - run: python -m unittest discover -s monitor -v
      - run: node --test monitor/test_transport_status.cjs
      - run: python docs/perfboard/validate_layout.py
      - run: python scripts/check_docs.py
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - run: arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli core install esp32:esp32@3.3.11 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli lib install 'DallasTemperature@4.0.6'
      - run: bash scripts/check_firmware.sh

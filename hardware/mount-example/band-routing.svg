<text x="580" y="129" font-size="17">Adjustable mounting arm</text>
<text x="580" y="162" font-size="17">20 mm spacers</text>
<text x="580" y="203" font-size="17">Hose-clamp screw stays above tube</text>
<text x="580" y="258" font-size="17">Printed saddle</text>
<text x="580" y="312" font-size="17" font-weight="700">Upper dry support · about Ø25.4</text>
<text x="580" y="338" font-size="15">1 mm EPDM between tube and clamp</text>
<text x="580" y="469" font-size="17">Lower dry support</text>
<text x="36" y="329" font-size="15">Thin steel band</text>
<text x="36" y="388" font-size="17" font-weight="700">≈12.7 mm</text>
<text x="36" y="410" font-size="15">clear gap</text>
<text x="35" y="565" font-size="18" font-weight="700">Wrap only the upper support. Do not cinch the two tubes together.</text>
<text x="35" y="593" font-size="15">R8: #8 × 2-inch self-tapping screws enter the saddle only. No screws enter the collector or roof.</text>

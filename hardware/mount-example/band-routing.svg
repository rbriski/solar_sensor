<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" role="img" aria-labelledby="title desc">
<title id="title">End view of saddle and stainless band on the upper dry support tube</title>
<desc id="desc">A printed saddle rests on a rubber-lined upper tube. The hose clamp wraps across the saddle and below that tube through the half-inch gap. The lower tube is separate. Twenty-millimeter spacers above the saddle provide room for the screw housing below the mounting arm.</desc>

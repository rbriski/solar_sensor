<g font-family="system-ui,sans-serif" fill="#203940">
<text x="35" y="37" font-size="23" font-weight="700">UPPER TUBE SADDLE · end view</text>
<text x="35" y="66" font-size="15">Attachment method; band routing is illustrative. The surrounding hub walls are omitted.</text>

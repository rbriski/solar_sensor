<text x="63" y="272" transform="rotate(-90 63 272)" text-anchor="middle" font-size="15" font-weight="700">2 inches = 50.8 mm under head</text>
<text x="466" y="128" font-size="17">Large washer · Ø12, about 1 mm thick</text>
<text x="466" y="168" font-size="17">Existing arm · 12 mm thick, 6 mm slot</text>
<text x="466" y="251" font-size="17">Existing spacer · 20 mm tall</text>
<text x="466" y="276" font-size="15">Ø4.5 bore lets the screw pass freely</text>
<text x="466" y="341" font-size="18" font-weight="700">Replacement saddle · 22 mm tall</text>
<text x="466" y="366" font-size="16">Ø3.5 pilot, 20 mm deep; no locknut</text>
<text x="466" y="418" font-size="16">17.8 mm nominal penetration, including point</text>
<text x="466" y="443" font-size="16">2.2 mm nominal clearance below screw tip</text>
<text x="466" y="468" font-size="15">Closed bottom: 2 mm plastic beneath pilot</text>
<text x="30" y="511" font-size="18" font-weight="700">Clamp saddles to the upper tubes first. Then add spacers and frame.</text>
<text x="30" y="539" font-size="15">Use #8 × 2-inch pointed self-tapping pan-head screws. Tighten gently with a hand screwdriver.</text>

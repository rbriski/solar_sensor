<g font-family="system-ui,sans-serif" fill="#203940">
<text x="30" y="36" font-size="23" font-weight="700">R8 · FASTEN ENTIRELY FROM ABOVE</text>
<text x="30" y="63" font-size="15">Section through one screw, outside the tube seat. Dimensions in mm.</text>

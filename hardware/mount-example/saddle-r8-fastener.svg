<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 565" role="img" aria-labelledby="title desc">
<title id="title">R8 saddle screw stack, section through one attachment hole</title>
<desc id="desc">A two-inch number-eight pan-head self-tapping screw passes through a large washer, the existing twelve-millimeter arm and twenty-millimeter spacer. It enters the replacement saddle by 17.8 millimeters. The blind pilot is 3.5 millimeters diameter and twenty millimeters deep, leaving a two-millimeter bottom. There is no nut.</desc>
